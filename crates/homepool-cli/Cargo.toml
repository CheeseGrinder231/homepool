[package]
name = "homepool-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "homepool"
path = "src/main.rs"

[dependencies]
homepool-adapter-garage = { version = "0.1.0", path = "../adapters/homepool-adapter-garage" }
homepool-core = { version = "0.1.0", path = "../homepool-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4", default-features = false }
toml = "0.9"

[dev-dependencies]
rustix = { version = "1.1", features = ["process"] }

[lints]
workspace = true
