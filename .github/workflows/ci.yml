name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo test --workspace --all-features --locked
      - name: Garage single-node S3 integration
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test -p homepool-adapter-garage --test garage --locked -- --ignored
      - name: Test the Docker adapter against the runner engine
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          cargo test -p homepool-adapter-docker --lib --locked -- --ignored
          docker pull alpine:3.22
          cargo test -p homepool-adapter-docker --test engine --locked -- --ignored --test-threads=1 --nocapture

  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Check the ratchet against the event base
        env:
          STRUCTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo xtask structure --base "$STRUCTURE_BASE"

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: '1.97.1'
          command: check licenses bans sources
