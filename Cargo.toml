[workspace]
members = ["crates/homepool-core", "crates/homepool-cli", "crates/adapters/homepool-adapter-docker", "crates/adapters/homepool-adapter-garage", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
